<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Mo Bashagha — Work</title>
    <style>
        html, body { height: 100%; margin: 0; background: #0a0a0a; }
        .lock {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 500 13px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #6b6b64;
            letter-spacing: 0.2em;
        }
        .lock span { animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 50% { opacity: 0.35; } }
    </style>
</head>
<body>
    <div class="lock"><span>UNLOCKING…</span></div>
    <script>
        (async () => {
            const PAYLOAD = '__PAYLOAD__';
            const toGate = () => location.replace('../?next=__SLUG__');
            const pass = sessionStorage.getItem('mo.work.pass');
            if (!pass) return toGate();
            try {
                const raw = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
                const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
                const key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: raw.slice(0, 16), iterations: 300000, hash: 'SHA-256' },
                    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
                const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
                document.open();
                document.write(new TextDecoder().decode(plain));
                document.close();
            } catch {
                sessionStorage.removeItem('mo.work.pass');
                toGate();
            }
        })();
    </script>
</body>
</html>
