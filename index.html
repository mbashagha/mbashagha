<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="twitter:title" content="MO THE LAWN! — Mo Bashagha">
    <meta name="twitter:description" content="Product designer at WhatsApp. Mow the lawn to enter the site. 🚜">
    <meta name="twitter:image" content="https://mobashagha.com/og.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@200;300;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --ink: #16301a;
            --cream: #fffbe8;
            --gold: #ffd740;
            --mow-a: #8fc257;
            --mow-b: #99cb61;
        }

        html, body {
            height: 100%;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Press Start 2P', monospace;
            color: var(--ink);
            overflow: hidden;
            touch-action: none;
            /* mowed lawn: stripes + faint cross-cut */
            background-color: var(--mow-a);
            background-image:
                repeating-linear-gradient(90deg, var(--mow-b) 0 48px, transparent 48px 96px),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 48px, rgba(0, 0, 0, 0.04) 48px 96px);
        }

        body:not(.done) { cursor: none; }
        body:not(.done) a, body:not(.done) button { cursor: none; }
        body.done { overflow: auto; touch-action: auto; }

        ::selection { background: var(--gold); color: var(--ink); }

        /* ---------- content under the grass ---------- */
        .scene {
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .panel {
            background: var(--cream);
            border: 4px solid var(--ink);
            box-shadow: 10px 10px 0 rgba(20, 46, 18, 0.35), inset 0 0 0 4px #fff;
            padding: clamp(1.5rem, 4vw, 2.75rem);
            max-width: 460px;
            width: 100%;
            text-align: center;
        }

        .tag {
            font-size: 0.6rem;
            color: #c62828;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: clamp(1.3rem, 5.5vw, 2rem);
            line-height: 1.45;
            letter-spacing: 0.02em;
            margin-bottom: 1.5rem;
            text-shadow: 3px 3px 0 #c5e1a5;
        }

        .sub {
            font-size: clamp(0.55rem, 2.4vw, 0.7rem);
            line-height: 2;
            color: #33691e;
            margin-bottom: 2rem;
        }

        .blink { animation: blink 1s steps(1) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .menu { display: grid; gap: 0.85rem; margin-bottom: 2rem; }

        .menu a {
            display: block;
            font-size: 0.7rem;
            color: var(--ink);
            text-decoration: none;
            border: 3px solid var(--ink);
            padding: 0.95rem 1rem;
            background: #fff;
            box-shadow: 4px 4px 0 var(--ink);
            transition: transform 0.08s steps(2), box-shadow 0.08s steps(2);
        }

        .menu a::before { content: '▶ '; visibility: hidden; }

        .menu a:hover, .menu a:focus-visible {
            background: var(--gold);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink);
        }

        .menu a:hover::before, .menu a:focus-visible::before { visibility: visible; }

        .tiny { font-size: 0.45rem; color: #6d8b5a; letter-spacing: 0.08em; }

        /* ---------- game layers ---------- */
        #grass, #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            pointer-events: none;
        }

        #grass { z-index: 5; transition: opacity 0.7s ease; }
        #grass.gone { opacity: 0; }
        #fx { z-index: 6; }

        #gl {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            display: none;
            transition: opacity 0.9s ease;
        }

        #gl.gone { opacity: 0; }
        body.ultra #gl { display: block; }
        body.ultra #grass { display: none; }

        /* ---------- toast ---------- */
        #toast {
            position: fixed;
            top: 4.5rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 7;
            text-align: center;
            color: #fff;
            background: rgba(13, 33, 16, 0.78);
            border: 3px solid var(--ink);
            padding: 1rem 1.25rem;
            pointer-events: none;
            animation: bob 1.2s steps(2) infinite;
            transition: opacity 0.4s ease;
            max-width: 92vw;
        }

        #toast h2 { font-size: clamp(0.7rem, 3vw, 0.95rem); color: var(--gold); margin-bottom: 0.6rem; }
        #toast p { font-size: clamp(0.45rem, 2vw, 0.55rem); line-height: 1.8; }
        #toast.hide { opacity: 0; }

        @keyframes bob { 50% { transform: translateX(-50%) translateY(4px); } }

        /* ---------- HUD ---------- */
        .hud {
            position: fixed;
            z-index: 8;
            font-size: 0.55rem;
            color: #fff;
        }

        #progress {
            top: 1rem;
            left: 1rem;
            background: rgba(13, 33, 16, 0.78);
            border: 3px solid var(--ink);
            padding: 0.65rem 0.8rem;
        }

        #progress .pct { color: var(--gold); }

        #controls { top: 1rem; right: 1rem; display: flex; gap: 0.5rem; }

        #controls button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.55rem;
            color: #fff;
            background: rgba(13, 33, 16, 0.78);
            border: 3px solid var(--ink);
            padding: 0.65rem 0.8rem;
        }

        #controls button:hover, #controls button:focus-visible { background: #c62828; }

        body.done #toast, body.done #mower { display: none; }
        body.done #controls #mowall { display: none; }

        /* ---------- mower cursor ---------- */
        #mower {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9;
            pointer-events: none;
            opacity: 0;
            will-change: transform;
        }

        #mower .sprite {
            display: block;
            transform: translate(-50%, -68%);
        }

        #mower.flip .sprite { transform: translate(-50%, -68%) scaleX(-1); }

        /* ---------- banner ---------- */
        #banner {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
        }

        #banner.show { display: flex; }

        #banner .inner {
            background: rgba(13, 33, 16, 0.88);
            border: 4px solid var(--gold);
            padding: 2rem 2.5rem;
            animation: pop 0.5s steps(4) both;
            transition: opacity 0.6s ease;
        }

        #banner.fade .inner { opacity: 0; }

        #banner h2 {
            font-size: clamp(1.1rem, 5vw, 1.8rem);
            color: var(--gold);
            text-shadow: 4px 4px 0 #5d4037;
            margin-bottom: 1rem;
        }

        #banner p { font-size: 0.6rem; color: #fff; letter-spacing: 0.15em; }

        @keyframes pop {
            0% { transform: scale(0.2); }
            100% { transform: scale(1); }
        }

        #banner .time {
            margin-top: 0.9rem;
            font-size: 0.55rem;
            color: var(--gold);
            letter-spacing: 0.1em;
            line-height: 1.8;
        }

        /* ---------- day / dusk / night palettes (mowed lawn) ---------- */
        body.dusk { --mow-a: #a9a24f; --mow-b: #b3ad57; }
        body.night { --mow-a: #3a5a48; --mow-b: #436a52; }

        /* ================= ULTRA (next-gen) theme ================= */

        #cutter {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 9;
            pointer-events: none;
            display: none;
            will-change: transform;
        }

        body.ultra:not(.done) #cutter.on { display: block; }
        body.ultra #mower { display: none !important; }

        #cutter .ring, #cutter .arc {
            position: absolute;
            width: 46px;
            height: 46px;
            left: 0;
            top: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        #cutter .ring {
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 18px rgba(255, 240, 180, 0.4), inset 0 0 14px rgba(255, 240, 180, 0.18);
        }

        #cutter .arc {
            border: 2px solid transparent;
            border-top-color: var(--gold);
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        body.ultra {
            font-family: 'Outfit', sans-serif;
            --mow-a: #5d8f3c;
            --mow-b: #67993f;
            /* smooth turf: wide soft stripes + vignette instead of the pixel checker */
            background-image:
                radial-gradient(ellipse at 50% 38%, rgba(255, 255, 245, 0.14), rgba(0, 0, 0, 0.30)),
                repeating-linear-gradient(90deg, var(--mow-b) 0 110px, transparent 110px 220px);
        }

        body.ultra.dusk { --mow-a: #8c8444; --mow-b: #968d4a; }
        body.ultra.night { --mow-a: #24382c; --mow-b: #2a4032; }

        body.ultra .panel {
            background: rgba(8, 14, 10, 0.55);
            -webkit-backdrop-filter: blur(18px) saturate(1.3);
            backdrop-filter: blur(18px) saturate(1.3);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 18px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
            color: #fff;
        }

        body.ultra .tag {
            color: var(--gold);
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 0.45em;
        }

        body.ultra h1 {
            font-weight: 200;
            font-size: clamp(2rem, 7vw, 3.1rem);
            letter-spacing: 0.18em;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.25);
        }

        body.ultra .sub {
            color: rgba(255, 255, 255, 0.65);
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.3em;
        }

        body.ultra .blink { animation: fadeblink 1.4s ease-in-out infinite; }
        @keyframes fadeblink { 50% { opacity: 0.1; } }

        body.ultra .menu a {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            box-shadow: none;
            color: #fff;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        body.ultra .menu a::before { content: none; }

        body.ultra .menu a:hover, body.ultra .menu a:focus-visible {
            background: rgba(255, 215, 64, 0.12);
            border-color: var(--gold);
            box-shadow: 0 0 24px rgba(255, 215, 64, 0.25);
            transform: none;
        }

        body.ultra .tiny { color: rgba(255, 255, 255, 0.4); letter-spacing: 0.25em; font-weight: 300; }

        body.ultra .hud, body.ultra #controls button {
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            letter-spacing: 0.2em;
            font-size: 0.72rem;
        }

        body.ultra #progress, body.ultra #controls button {
            background: rgba(8, 14, 10, 0.5);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            padding: 0.6rem 1.05rem;
            transition: background 0.25s ease, border-color 0.25s ease;
        }

        body.ultra #controls button:hover, body.ultra #controls button:focus-visible {
            background: rgba(255, 215, 64, 0.18);
            border-color: var(--gold);
        }

        body.ultra #toast {
            background: rgba(8, 14, 10, 0.55);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            animation: floaty 3s ease-in-out infinite;
        }

        @keyframes floaty { 50% { transform: translateX(-50%) translateY(6px); } }

        body.ultra #toast h2 {
            font-weight: 600;
            letter-spacing: 0.4em;
            font-size: 0.95rem;
        }

        body.ultra #toast p {
            font-weight: 300;
            letter-spacing: 0.25em;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.7);
        }

        body.ultra #banner .inner {
            background: rgba(5, 10, 7, 0.6);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 64, 0.5);
            border-radius: 18px;
            animation: popsoft 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes popsoft {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        body.ultra #banner h2 {
            font-weight: 200;
            letter-spacing: 0.4em;
            text-shadow: 0 0 40px rgba(255, 215, 64, 0.7);
        }

        body.ultra #banner p, body.ultra #banner .time {
            font-weight: 300;
            letter-spacing: 0.3em;
        }

        @media (prefers-reduced-motion: reduce) {
            .blink, #toast, #cutter .arc { animation: none; }
        }

        @media (max-width: 480px) {
            #progress { font-size: 0.45rem; padding: 0.5rem 0.6rem; }
            #controls button { font-size: 0.45rem; padding: 0.5rem 0.6rem; }
            #toast { top: 3.6rem; }
        }
    </style>
</head>
<body>
    <main class="scene">
        <div class="panel">
            <p class="tag">★ PRODUCT DESIGNER ★</p>
            <h1>MO BASHAGHA</h1>
            <p class="sub">CURRENTLY DESIGNING<br>WHATSAPP<span class="blink">▮</span></p>
            <nav class="menu">
                <a href="mailto:mbashagha@gmail.com">EMAIL</a>
                <a href="https://www.linkedin.com/in/mobashagha/" target="_blank" rel="noopener">LINKEDIN</a>
            </nav>
            <p class="tiny">© <span id="year">2026</span> MO BASHAGHA · 8-BIT EDITION</p>
        </div>
    </main>

    <canvas id="grass"></canvas>
    <canvas id="gl"></canvas>
    <canvas id="fx"></canvas>

    <div id="toast">
        <h2>MO THE LAWN!</h2>
        <p>MOVE YOUR CURSOR (OR DRAG)<br>TO REVEAL THE SITE</p>
    </div>

    <div id="progress" class="hud" role="status">LAWN MOWED: <span class="pct">0%</span></div>
    <div id="controls" class="hud">
        <button id="mowall" type="button">MOW ALL ⏭</button>
        <button id="gfxbtn" type="button" aria-label="Toggle graphics mode">ULTRA</button>
        <button id="modebtn" type="button" aria-label="Toggle day and night">☀️</button>
        <button id="mute" type="button" aria-pressed="false" aria-label="Toggle sound">🔇</button>
    </div>

    <div id="cutter" aria-hidden="true"><span class="ring"></span><span class="arc"></span></div>

    <div id="mower" aria-hidden="true">
        <svg class="sprite" width="64" height="48" viewBox="0 0 16 12" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
            <!-- handle -->
            <rect x="1" y="0" width="2" height="1" fill="#37474f"/>
            <rect x="3" y="1" width="1" height="1" fill="#546e7a"/>
            <rect x="4" y="2" width="1" height="1" fill="#546e7a"/>
            <rect x="5" y="3" width="1" height="1" fill="#546e7a"/>
            <rect x="6" y="4" width="1" height="1" fill="#546e7a"/>
            <!-- engine -->
            <rect x="9" y="4" width="3" height="1" fill="#b71c1c"/>
            <!-- body -->
            <rect x="5" y="5" width="8" height="1" fill="#ef9a9a"/>
            <rect x="5" y="6" width="8" height="2" fill="#e53935"/>
            <!-- blade housing -->
            <rect x="13" y="6" width="1" height="3" fill="#455a64"/>
            <!-- wheels -->
            <rect x="5" y="8" width="3" height="3" fill="#212121"/>
            <rect x="6" y="9" width="1" height="1" fill="#fafafa"/>
            <rect x="10" y="8" width="3" height="3" fill="#212121"/>
            <rect x="11" y="9" width="1" height="1" fill="#fafafa"/>
            <!-- grass spray -->
            <rect x="15" y="6" width="1" height="1" fill="#7cb342"/>
            <rect x="14" y="4" width="1" height="1" fill="#9ccc65"/>
            <rect x="15" y="9" width="1" height="1" fill="#7cb342"/>
        </svg>
    </div>

    <div id="banner">
        <div class="inner">
            <h2>LEVEL CLEAR!</h2>
            <p>LAWN 100% MOWED ★★★</p>
            <p class="time" id="clearTime" hidden></p>
        </div>
    </div>

    <!-- Silent loop: playing it puts iOS in media-playback mode so Web Audio
         is heard even with the ring/silent switch on. -->
    <audio id="unmuter" loop playsinline preload="auto" src="data:audio/wav;base64,UklGRrQBAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YZABAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA"></audio>

    <script>
    (function () {
        'use strict';

        document.getElementById('year').textContent = new Date().getFullYear();

        var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var body = document.body;
        var grass = document.getElementById('grass');
        var fx = document.getElementById('fx');
        var mowerEl = document.getElementById('mower');
        var toast = document.getElementById('toast');
        var pctEl = document.querySelector('#progress .pct');
        var progressEl = document.getElementById('progress');
        var banner = document.getElementById('banner');
        var mowallBtn = document.getElementById('mowall');
        var muteBtn = document.getElementById('mute');
        var modeBtn = document.getElementById('modebtn');
        var gfxBtn = document.getElementById('gfxbtn');
        var glCv = document.getElementById('gl');
        var cutter = document.getElementById('cutter');

        /* ---------- graphics mode (retro pixels vs ultra WebGL) ---------- */
        var qgfx = (location.search.match(/[?&]gfx=(retro|ultra)/) || [])[1];
        var sgfx = null;
        try { sgfx = localStorage.getItem('gfxMode'); } catch (e) { /* ignore */ }
        var gfx = qgfx || (sgfx === 'ultra' ? 'ultra' : 'retro');

        /* ---------- day / dusk / night mode ---------- */
        var qmode = (location.search.match(/[?&]mode=(day|dusk|night)/) || [])[1];
        var hour = new Date().getHours();
        var mode = qmode || (hour >= 21 || hour < 6 ? 'night' : hour >= 17 ? 'dusk' : 'day');
        var MODE_ICON = { day: '☀️', dusk: '🌆', night: '🌙' };
        if (mode !== 'day') body.classList.add(mode);
        modeBtn.textContent = MODE_ICON[mode];

        if (reduced) {
            // No game: show the site directly.
            body.classList.add('done');
            grass.style.display = 'none';
            fx.style.display = 'none';
            progressEl.style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            return;
        }

        var TILE = 24;
        var FRAMES = 4;
        var SWAY = [0, 1, 0, -1]; // logical-pixel offsets per frame
        var P = 3;                // logical pixel size inside a tile (8x8 grid)

        var gctx = grass.getContext('2d');
        var fctx = fx.getContext('2d');

        var cols = 0, rows = 0, total = 0, mowedCount = 0;
        var mowed = null, variants = null, phases = null;
        var finished = false;
        var sweepTimer = null;

        /* ---------- sprites ---------- */
        // Blade layout per variant: [x, height] pairs on an 8x8 grid.
        var BLADES = [
            [[1, 5], [3, 7], [5, 4], [6, 6]],
            [[0, 6], [2, 4], [4, 7], [7, 5]],
            [[1, 7], [3, 5], [5, 6], [7, 4]],
            [[0, 4], [2, 6], [5, 7], [6, 5]],
            [[0, 5], [6, 6]], // + daisy
            [[1, 6], [7, 4]]  // + tulip
        ];
        // Grass colors per time-of-day mode.
        var PALS = {
            day:   { base: ['#2f7d33', '#2a7430'], blade: '#1d5e23', tip: '#6abf69', mid: '#2f8f3a', speck: '#27632b' },
            dusk:  { base: ['#717c30', '#697428'], blade: '#4d5821', tip: '#c2cc66', mid: '#86913a', speck: '#5d682a' },
            night: { base: ['#1f3b2f', '#1b352a'], blade: '#13291f', tip: '#4d7d65', mid: '#254b3c', speck: '#17312b' }
        };

        var sprites = []; // [shade][variant][frame] -> canvas

        function px(ctx, x, y, color) {
            if (x < 0 || x > 7 || y < 0 || y > 7) return;
            ctx.fillStyle = color;
            ctx.fillRect(x * P, y * P, P, P);
        }

        function buildSprites() {
            var pal = PALS[mode];
            sprites = [];
            for (var s = 0; s < 2; s++) {
                sprites[s] = [];
                for (var v = 0; v < BLADES.length; v++) {
                    sprites[s][v] = [];
                    for (var f = 0; f < FRAMES; f++) {
                        var c = document.createElement('canvas');
                        c.width = TILE; c.height = TILE;
                        var ctx = c.getContext('2d');
                        ctx.fillStyle = pal.base[s];
                        ctx.fillRect(0, 0, TILE, TILE);
                        // ground texture specks
                        px(ctx, (v * 3 + s) % 8, 7, pal.speck);
                        px(ctx, (v * 5 + 4) % 8, 6, pal.speck);
                        var dx = SWAY[f];
                        var blades = BLADES[v];
                        for (var b = 0; b < blades.length; b++) {
                            var bx = blades[b][0], h = blades[b][1];
                            var top = 8 - h;
                            for (var y = top; y < 8; y++) px(ctx, bx, y, pal.blade);
                            // swaying lighter tip (tall blades lean with the wind)
                            var lean = h >= 6 ? dx : 0;
                            px(ctx, bx + lean, top, pal.tip);
                            if (h >= 7) px(ctx, bx + lean, top + 1, pal.mid);
                        }
                        if (v === 4) { // daisy
                            var hx = 3 + dx, hy = 1;
                            px(ctx, hx, hy - 1, '#ffffff'); px(ctx, hx - 1, hy, '#ffffff');
                            px(ctx, hx + 1, hy, '#ffffff'); px(ctx, hx, hy + 1, '#ffffff');
                            px(ctx, hx, hy, '#ffd740');
                            for (var dy = 2; dy < 8; dy++) px(ctx, 3, dy, pal.blade);
                        }
                        if (v === 5) { // tulip
                            var tx = 4 + dx;
                            px(ctx, tx, 1, '#ec407a'); px(ctx, tx - 1, 1, '#f48fb1'); px(ctx, tx + 1, 1, '#f48fb1');
                            for (var ty = 2; ty < 8; ty++) px(ctx, 4, ty, pal.blade);
                        }
                        sprites[s][v][f] = c;
                    }
                }
            }
        }

        function setMode(m) {
            if (!PALS[m]) return;
            mode = m;
            body.classList.remove('dusk', 'night');
            if (m !== 'day') body.classList.add(m);
            modeBtn.textContent = MODE_ICON[m];
            buildSprites();
            if (!finished && grass.width) {
                gctx.clearRect(0, 0, grass.width, grass.height);
                drawGrass();
            }
            spawnFlies(m === 'night' ? 22 : m === 'dusk' ? 7 : 0);
        }

        modeBtn.addEventListener('click', function () {
            var order = ['day', 'dusk', 'night'];
            setMode(order[(order.indexOf(mode) + 1) % 3]);
        });

        /* ---------- ULTRA renderer (procedural WebGL grass) ---------- */
        // Photographic color sets per time of day [tall-dark, tall-light, cut-dark, cut-light].
        var UPALS = {
            day:   { t0: [0.07, 0.23, 0.07], t1: [0.41, 0.64, 0.22], c0: [0.40, 0.58, 0.24], c1: [0.52, 0.70, 0.30], amb: 1.0 },
            dusk:  { t0: [0.16, 0.15, 0.05], t1: [0.62, 0.52, 0.18], c0: [0.52, 0.47, 0.20], c1: [0.64, 0.57, 0.24], amb: 0.85 },
            night: { t0: [0.015, 0.05, 0.04], t1: [0.10, 0.24, 0.17], c0: [0.09, 0.18, 0.13], c1: [0.12, 0.23, 0.17], amb: 0.5 }
        };

        var gl = null, glOK = false, glProg = null, glU = {}, maskTex = null;
        var maskData = null, maskDirty = true;
        var dprU = Math.min(window.devicePixelRatio || 1, 1.5);
        var ultraRunning = false;
        var finishedAt = 0;

        var FRAG = [
            'precision mediump float;',
            'uniform vec2 uRes;',
            'uniform float uTime;',
            'uniform sampler2D uMask;',
            'uniform vec2 uGridPx;',
            'uniform vec3 uT0, uT1, uC0, uC1;',
            'uniform float uAmb;',
            'uniform vec2 uCursor;',
            'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
            'float noise(vec2 p){',
            '  vec2 i = floor(p), f = fract(p);',
            '  vec2 u = f * f * (3.0 - 2.0 * f);',
            '  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),',
            '             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);',
            '}',
            'float fbm(vec2 p){',
            '  float v = 0.0, a = 0.5;',
            '  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }',
            '  return v;',
            '}',
            'void main(){',
            '  vec2 p = gl_FragCoord.xy;',
            '  vec2 uv = p / uRes;',
            '  vec2 mp = vec2(p.x, uRes.y - p.y);',
            '  float m = texture2D(uMask, mp / uGridPx).r;',
            // wind field: slow rolling waves across the lawn
            '  float w = fbm(p * 0.0035 + vec2(uTime * 0.30, uTime * 0.06));',
            '  float wave = sin(p.x * 0.0045 + p.y * 0.0022 + uTime * 1.4 + w * 5.0);',
            // tall grass: vertical blade streaks sheared by the wind
            '  float blades = noise(vec2(p.x * 0.28 + wave * 7.0 + w * 14.0, p.y * 0.035));',
            '  float blades2 = noise(vec2(p.x * 0.10 - wave * 4.0, p.y * 0.020 + 7.0));',
            '  float clump = fbm(p * 0.012 + w * 0.6);',
            '  float tallMix = clamp(blades * 0.55 + blades2 * 0.30 + clump * 0.45, 0.0, 1.0);',
            '  vec3 tall = mix(uT0, uT1, tallMix);',
            '  float sheen = smoothstep(0.55, 1.0, wave * 0.5 + w * 0.7) * 0.22;',
            '  tall += sheen * vec3(0.9, 1.0, 0.6) * uAmb;',
            // cut turf: fine texture + mow stripes
            '  float turf = noise(p * 0.09) * 0.6 + noise(p * 0.025) * 0.4;',
            '  float stripe = 0.96 + 0.07 * step(0.5, fract(p.x / 192.0));',
            '  vec3 cut = mix(uC0, uC1, turf) * stripe;',
            // blend with darkened fresh-cut edge
            '  float blend = smoothstep(0.32, 0.68, m);',
            '  float edge = smoothstep(0.10, 0.5, m) * smoothstep(0.90, 0.5, m);',
            '  vec3 col = mix(tall, cut, blend);',
            '  col *= 1.0 - edge * 0.28;',
            // soft light halo around the cutter
            '  float d = distance(p, uCursor);',
            '  col += exp(-d * d / 18000.0) * vec3(0.30, 0.28, 0.16) * uAmb;',
            // cinematic grade: vignette + grain
            '  vec2 q = uv * (1.0 - uv);',
            '  float vig = pow(q.x * q.y * 15.0, 0.18);',
            '  col *= mix(0.55, 1.08, vig);',
            '  col += (hash(p + fract(uTime) * 61.7) - 0.5) * 0.035;',
            '  gl_FragColor = vec4(col, 1.0);',
            '}'
        ].join('\n');

        function initGL() {
            try {
                gl = glCv.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: false }) ||
                     glCv.getContext('experimental-webgl');
            } catch (e) { gl = null; }
            if (!gl) { gfxBtn.style.display = 'none'; return; }
            function sh(type, src) {
                var s = gl.createShader(type);
                gl.shaderSource(s, src);
                gl.compileShader(s);
                if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
                return s;
            }
            try {
                glProg = gl.createProgram();
                gl.attachShader(glProg, sh(gl.VERTEX_SHADER, 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }'));
                gl.attachShader(glProg, sh(gl.FRAGMENT_SHADER, FRAG));
                gl.linkProgram(glProg);
                if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(glProg));
            } catch (e) {
                gfxBtn.style.display = 'none';
                gl = null;
                return;
            }
            gl.useProgram(glProg);
            var buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            var loc = gl.getAttribLocation(glProg, 'aPos');
            gl.enableVertexAttribArray(loc);
            gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
            ['uRes', 'uTime', 'uMask', 'uGridPx', 'uT0', 'uT1', 'uC0', 'uC1', 'uAmb', 'uCursor'].forEach(function (n) {
                glU[n] = gl.getUniformLocation(glProg, n);
            });
            maskTex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, maskTex);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            glOK = true;
        }

        function resizeGL() {
            if (!glOK) return;
            glCv.width = Math.round(window.innerWidth * dprU);
            glCv.height = Math.round(window.innerHeight * dprU);
            gl.viewport(0, 0, glCv.width, glCv.height);
            maskData = new Uint8Array(total);
            maskDirty = true;
        }

        function uploadMask() {
            for (var i = 0; i < total; i++) maskData[i] = mowed[i] ? 255 : 0;
            gl.bindTexture(gl.TEXTURE_2D, maskTex);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, cols, rows, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, maskData);
        }

        function ultraLoop(t) {
            if (gfx !== 'ultra' || !glOK) { ultraRunning = false; return; }
            if (finished && finishedAt && performance.now() - finishedAt > 1600) { ultraRunning = false; return; }
            if (maskDirty) { uploadMask(); maskDirty = false; }
            var pal = UPALS[mode];
            gl.uniform2f(glU.uRes, glCv.width, glCv.height);
            gl.uniform1f(glU.uTime, t * 0.001);
            gl.uniform1i(glU.uMask, 0);
            gl.uniform2f(glU.uGridPx, cols * TILE * dprU, rows * TILE * dprU);
            gl.uniform3fv(glU.uT0, pal.t0);
            gl.uniform3fv(glU.uT1, pal.t1);
            gl.uniform3fv(glU.uC0, pal.c0);
            gl.uniform3fv(glU.uC1, pal.c1);
            gl.uniform1f(glU.uAmb, pal.amb);
            gl.uniform2f(glU.uCursor,
                (lastX === null ? -9999 : lastX * dprU),
                (lastY === null ? -9999 : glCv.height - lastY * dprU));
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(ultraLoop);
        }

        function startUltra() {
            if (!glOK || ultraRunning) return;
            ultraRunning = true;
            requestAnimationFrame(ultraLoop);
        }

        function setGfx(g, save) {
            if (g === 'ultra' && !glOK) g = 'retro';
            gfx = g;
            body.classList.toggle('ultra', g === 'ultra');
            gfxBtn.textContent = g === 'ultra' ? '8-BIT' : 'ULTRA';
            if (g === 'ultra') { maskDirty = true; startUltra(); }
            if (save) { try { localStorage.setItem('gfxMode', g); } catch (e) { /* ignore */ } }
        }

        gfxBtn.addEventListener('click', function () {
            setGfx(gfx === 'ultra' ? 'retro' : 'ultra', true);
            if (soundOn && audio && audio.state === 'running') blip(gfx === 'ultra' ? 220 : 660, audio.currentTime, 0.1, 0.08);
        });

        /* ---------- grid ---------- */
        function initGrid() {
            var w = window.innerWidth, h = window.innerHeight;
            grass.width = w; grass.height = h;
            fx.width = w; fx.height = h;
            var newCols = Math.ceil(w / TILE), newRows = Math.ceil(h / TILE);
            var newMowed = new Uint8Array(newCols * newRows);
            var newVar = new Uint8Array(newCols * newRows);
            var newPhase = new Uint8Array(newCols * newRows);
            mowedCount = 0;
            for (var r = 0; r < newRows; r++) {
                for (var c = 0; c < newCols; c++) {
                    var i = r * newCols + c;
                    if (mowed && c < cols && r < rows && mowed[r * cols + c]) {
                        newMowed[i] = 1; mowedCount++;
                        newVar[i] = variants[r * cols + c];
                        newPhase[i] = phases[r * cols + c];
                    } else {
                        var roll = Math.random();
                        newVar[i] = roll < 0.02 ? 4 : roll < 0.04 ? 5 : (Math.random() * 4) | 0;
                        newPhase[i] = (Math.random() * FRAMES) | 0;
                    }
                }
            }
            cols = newCols; rows = newRows;
            mowed = newMowed; variants = newVar; phases = newPhase;
            total = cols * rows;
            drawGrass();
            resizeGL();
        }

        var frame = 0;

        function drawGrass() {
            for (var r = 0; r < rows; r++) {
                for (var c = 0; c < cols; c++) {
                    var i = r * cols + c;
                    if (mowed[i]) continue;
                    var shade = (r + c) & 1;
                    gctx.drawImage(sprites[shade][variants[i]][(frame + phases[i]) % FRAMES], c * TILE, r * TILE);
                }
            }
        }

        /* ---------- wind loop (chunky retro framerate) ---------- */
        var lastTick = 0;
        function windLoop(t) {
            if (finished) return;
            if (gfx !== 'retro') { requestAnimationFrame(windLoop); return; }
            if (t - lastTick > 160) {
                lastTick = t;
                frame = (frame + 1) % FRAMES;
                gctx.clearRect(0, 0, grass.width, grass.height);
                drawGrass();
            }
            requestAnimationFrame(windLoop);
        }

        /* ---------- particles ---------- */
        var parts = [];

        function spawnClippings(x, y, n) {
            for (var i = 0; i < n; i++) {
                if (gfx === 'ultra') {
                    parts.push({
                        x: x + (Math.random() - 0.5) * TILE,
                        y: y + (Math.random() - 0.5) * TILE,
                        vx: (Math.random() - 0.5) * 1.8,
                        vy: -1.2 - Math.random() * 2,
                        life: 0.9,
                        w: 2, h: 5 + ((Math.random() * 6) | 0),
                        color: ['#3f7d2f', '#5b9c3a', '#7ab94f'][(Math.random() * 3) | 0],
                        g: 0.12
                    });
                } else {
                    parts.push({
                        x: x + (Math.random() - 0.5) * TILE,
                        y: y + (Math.random() - 0.5) * TILE,
                        vx: (Math.random() - 0.5) * 2.4,
                        vy: -1.5 - Math.random() * 2.2,
                        life: 1,
                        size: 3 + ((Math.random() * 2) | 0) * 2,
                        color: ['#1d5e23', '#2f7d33', '#6abf69'][(Math.random() * 3) | 0],
                        g: 0.18
                    });
                }
            }
        }

        var CONFETTI = ['#ff5252', '#ffd740', '#40c4ff', '#69f0ae', '#ff4081', '#ffffff'];

        function spawnConfetti() {
            var cx = fx.width / 2, cy = fx.height / 2;
            if (gfx === 'ultra') {
                // drifting golden light motes instead of hard confetti
                for (var j = 0; j < 80; j++) {
                    var aj = Math.random() * Math.PI * 2;
                    var sj = 1 + Math.random() * 4;
                    parts.push({
                        x: cx, y: cy,
                        vx: Math.cos(aj) * sj,
                        vy: Math.sin(aj) * sj - 1.2,
                        life: 2 + Math.random() * 1.5,
                        size: 3 + ((Math.random() * 3) | 0),
                        color: ['#ffd740', '#fff6c2', '#ffe97a'][(Math.random() * 3) | 0],
                        g: 0.025,
                        glow: true
                    });
                }
                return;
            }
            for (var i = 0; i < 160; i++) {
                var a = Math.random() * Math.PI * 2;
                var sp = 3 + Math.random() * 7;
                parts.push({
                    x: cx, y: cy,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp - 3,
                    life: 1.6 + Math.random(),
                    size: 4 + ((Math.random() * 2) | 0) * 2,
                    color: CONFETTI[(Math.random() * CONFETTI.length) | 0],
                    g: 0.12
                });
            }
        }

        /* ---------- critters ---------- */
        var critters = [];

        function cpx(x, y, c) {
            fctx.fillStyle = c;
            fctx.fillRect(Math.round(x), Math.round(y), P, P);
        }

        function tileIndexAt(x, y) {
            var c = Math.floor(x / TILE), r = Math.floor(y / TILE);
            if (c < 0 || r < 0 || c >= cols || r >= rows) return -1;
            return r * cols + c;
        }

        function tileMowedAt(x, y) {
            var i = tileIndexAt(x, y);
            return i === -1 || !!mowed[i];
        }

        function randUnmowedTile() {
            if (mowedCount >= total) return null;
            for (var t = 0; t < 80; t++) {
                var i = (Math.random() * total) | 0;
                if (!mowed[i]) return i;
            }
            return null;
        }

        function tileCenter(i) {
            return { x: ((i % cols) + 0.5) * TILE, y: (((i / cols) | 0) + 0.5) * TILE };
        }

        function nearbyUnmowed(cr, radiusTiles) {
            for (var t = 0; t < 24; t++) {
                var c = Math.floor(cr.x / TILE) + ((Math.random() * (radiusTiles * 2 + 1)) | 0) - radiusTiles;
                var r = Math.floor(cr.y / TILE) + ((Math.random() * (radiusTiles * 2 + 1)) | 0) - radiusTiles;
                if (c < 0 || r < 0 || c >= cols || r >= rows) continue;
                var i = r * cols + c;
                if (!mowed[i]) return i;
            }
            return null;
        }

        function mowerNear(cr, distTiles) {
            if (lastX === null || finished) return false;
            var dx = cr.x - lastX, dy = cr.y - lastY;
            var d = TILE * distTiles;
            return dx * dx + dy * dy < d * d;
        }

        function awayPoint(cr, distTiles) {
            var ang = lastX === null ? Math.random() * Math.PI * 2
                                     : Math.atan2(cr.y - lastY, cr.x - lastX);
            return {
                x: Math.max(TILE, Math.min(fx.width - TILE, cr.x + Math.cos(ang) * TILE * distTiles)),
                y: Math.max(TILE, Math.min(fx.height - TILE, cr.y + Math.sin(ang) * TILE * distTiles))
            };
        }

        function edgePoint(cr) {
            // a point well past the nearest screen edge
            var dl = cr.x, dr = fx.width - cr.x, dt = cr.y, db = fx.height - cr.y;
            var m = Math.min(dl, dr, dt, db);
            if (m === dl) return { x: -TILE * 3, y: cr.y };
            if (m === dr) return { x: fx.width + TILE * 3, y: cr.y };
            if (m === dt) return { x: cr.x, y: -TILE * 3 };
            return { x: cr.x, y: fx.height + TILE * 3 };
        }

        function offscreen(cr) {
            return cr.x < -TILE * 2 || cr.x > fx.width + TILE * 2 ||
                   cr.y < -TILE * 2 || cr.y > fx.height + TILE * 2;
        }

        function makeCritter(type) {
            var i = randUnmowedTile();
            var p = i === null ? { x: Math.random() * fx.width, y: Math.random() * fx.height * 0.8 }
                               : tileCenter(i);
            return {
                type: type, x: p.x, y: p.y, tx: p.x, ty: p.y,
                vx: 0, vy: 0, dir: 1, p: 0, t: 60 + Math.random() * 180,
                state: 'idle', ph: 'hidden', phase: Math.random() * 6.28,
                hist: [], fleeT: 0, exiting: false, gone: false, init: false,
                color: ['#ff7043', '#ffd740', '#f06292', '#4fc3f7'][(Math.random() * 4) | 0]
            };
        }

        function startHop(cr, tx, ty, fast) {
            cr.fx0 = cr.x; cr.fy0 = cr.y;
            cr.tx = tx; cr.ty = ty;
            cr.p = 0; cr.fast = fast; cr.state = 'hop';
            if (tx < cr.x - 2) cr.dir = -1; else if (tx > cr.x + 2) cr.dir = 1;
        }

        function drawFrog(cr, stretched) {
            var G = '#66bb6a', L = '#a5d6a7', D = '#2e7d32';
            function o(gx, gy, c) { cpx(cr.x + gx * P * cr.dir, cr.y + gy * P, c); }
            if (stretched) {
                o(-2, -1, G); o(-1, -1, G); o(0, -1, G); o(1, -1, G); o(2, -1, G);
                o(-1, 0, L); o(0, 0, L); o(1, 0, L);
                o(-3, 0, D); o(3, 0, D);
                o(2, -2, '#ffffff');
            } else {
                o(-1, -3, '#ffffff'); o(1, -3, '#ffffff');
                o(-2, -2, G); o(-1, -2, G); o(0, -2, G); o(1, -2, G);
                o(-2, -1, G); o(-1, -1, L); o(0, -1, L); o(1, -1, G);
                o(-2, 0, D); o(1, 0, D);
            }
        }

        function drawSnake(cr, now) {
            var seg, j;
            for (j = 4; j >= 1; j--) {
                seg = cr.hist[cr.hist.length - 1 - j * 5];
                if (!seg) continue;
                cpx(seg.x, seg.y, j % 2 ? '#33691e' : '#558b2f');
            }
            cpx(cr.x, cr.y, '#7cb342');
            cpx(cr.x + P * cr.dir, cr.y, '#7cb342');
            if ((now % 900) < 160) cpx(cr.x + P * 2 * cr.dir, cr.y, '#e53935'); // tongue
        }

        function drawMole(cr, lift) {
            function o(gx, gy, c) { cpx(cr.x + gx * P, cr.y + gy * P, c); }
            o(-2, 0, '#4e342e'); o(-1, 0, '#5d4037'); o(0, 0, '#5d4037'); o(1, 0, '#5d4037'); o(2, 0, '#4e342e');
            if (lift > 0.3) { o(-1, -1, '#8d6e63'); o(0, -1, '#8d6e63'); o(1, -1, '#8d6e63'); }
            if (lift > 0.7) {
                o(-1, -2, '#8d6e63'); o(0, -2, '#8d6e63'); o(1, -2, '#8d6e63');
                o(0, -1, '#f48fb1'); // nose
                o(-1, -2, '#3e2723'); o(1, -2, '#3e2723'); // eyes
            }
        }

        function drawButterfly(cr, open) {
            function o(gx, gy, c) { cpx(cr.x + gx * P, cr.y + gy * P, c); }
            o(0, -1, '#4e342e'); o(0, 0, '#4e342e');
            if (open) {
                o(-1, -1, cr.color); o(1, -1, cr.color);
                o(-2, -2, cr.color); o(2, -2, cr.color);
                o(-2, 0, cr.color); o(2, 0, cr.color);
            } else {
                o(-1, -2, cr.color); o(1, -2, cr.color);
            }
        }

        function updateCritter(cr, now) {
            var tgt, pt, pp, ang, d;

            if (cr.type === 'frog') {
                if (cr.state === 'idle') {
                    if (finished || tileMowedAt(cr.x, cr.y)) {
                        var ti = randUnmowedTile();
                        if (ti === null || finished) { cr.exiting = true; pt = awayPoint(cr, 5); var ep = edgePoint(cr); startHop(cr, cr.x + (ep.x - cr.x) * 0.35, cr.y + (ep.y - cr.y) * 0.35, true); }
                        else { pt = tileCenter(ti); startHop(cr, pt.x, pt.y, true); }
                    } else if (mowerNear(cr, 4)) {
                        pt = awayPoint(cr, 5);
                        startHop(cr, pt.x, pt.y, true);
                    } else if (--cr.t <= 0) {
                        var ni = nearbyUnmowed(cr, 3);
                        if (ni !== null) { pt = tileCenter(ni); startHop(cr, pt.x, pt.y, false); }
                        cr.t = 90 + Math.random() * 220;
                    }
                } else { // hop
                    cr.p += cr.fast ? 0.11 : 0.06;
                    pp = Math.min(1, cr.p);
                    cr.x = cr.fx0 + (cr.tx - cr.fx0) * pp;
                    cr.y = cr.fy0 + (cr.ty - cr.fy0) * pp - Math.sin(pp * Math.PI) * 16;
                    if (pp >= 1) {
                        if (cr.exiting) {
                            if (offscreen(cr)) { cr.gone = true; return; }
                            var ep2 = edgePoint(cr);
                            startHop(cr, cr.x + (ep2.x - cr.x) * 0.5, cr.y + (ep2.y - cr.y) * 0.5, true);
                        } else {
                            cr.state = 'idle';
                            cr.t = 90 + Math.random() * 220;
                        }
                    }
                }
                drawFrog(cr, cr.state === 'hop');
            }

            if (cr.type === 'snake') {
                if (!cr.init) {
                    cr.init = true; cr.spd = 0.45;
                    tgt = randUnmowedTile();
                    if (tgt !== null) { pt = tileCenter(tgt); cr.tx = pt.x; cr.ty = pt.y; }
                }
                if (finished && !cr.exiting) {
                    cr.exiting = true;
                    pt = edgePoint(cr); cr.tx = pt.x; cr.ty = pt.y; cr.spd = 1.6;
                } else if (!cr.exiting) {
                    if (cr.fleeT > 0) { cr.fleeT--; if (cr.fleeT === 0) cr.spd = 0.45; }
                    else if (mowerNear(cr, 4)) {
                        pt = awayPoint(cr, 7); cr.tx = pt.x; cr.ty = pt.y;
                        cr.spd = 2.4; cr.fleeT = 45;
                    }
                    var sdx = cr.tx - cr.x, sdy = cr.ty - cr.y;
                    if (sdx * sdx + sdy * sdy < 25) {
                        tgt = randUnmowedTile();
                        if (tgt === null) { cr.exiting = true; pt = edgePoint(cr); cr.tx = pt.x; cr.ty = pt.y; cr.spd = 1.6; }
                        else { pt = tileCenter(tgt); cr.tx = pt.x; cr.ty = pt.y; }
                    }
                }
                ang = Math.atan2(cr.ty - cr.y, cr.tx - cr.x);
                var wig = Math.sin(now * 0.012 + cr.phase) * 0.9;
                cr.x += Math.cos(ang) * cr.spd - Math.sin(ang) * wig;
                cr.y += Math.sin(ang) * cr.spd + Math.cos(ang) * wig;
                cr.dir = Math.cos(ang) < 0 ? -1 : 1;
                cr.hist.push({ x: cr.x, y: cr.y });
                if (cr.hist.length > 30) cr.hist.shift();
                if (cr.exiting && offscreen(cr)) { cr.gone = true; return; }
                drawSnake(cr, now);
            }

            if (cr.type === 'mole') {
                if (cr.ph === 'hidden') {
                    if (--cr.t <= 0) {
                        if (finished) { cr.gone = true; return; }
                        if (tileMowedAt(cr.x, cr.y) || Math.random() < 0.4) {
                            var mi = randUnmowedTile();
                            if (mi === null) { cr.gone = true; return; }
                            pt = tileCenter(mi); cr.x = pt.x; cr.y = pt.y;
                        }
                        cr.ph = 'rise'; cr.t = 16;
                    }
                } else if (cr.ph === 'rise') {
                    cr.lift = 1 - cr.t / 16;
                    if (--cr.t <= 0) { cr.ph = 'up'; cr.t = 120 + Math.random() * 160; }
                } else if (cr.ph === 'up') {
                    cr.lift = 1;
                    if (finished || tileMowedAt(cr.x, cr.y) || mowerNear(cr, 3.5)) { cr.ph = 'sink'; cr.t = 8; }
                    else if (--cr.t <= 0) { cr.ph = 'sink'; cr.t = 12; }
                } else { // sink
                    cr.lift = cr.t / 12;
                    if (--cr.t <= 0) {
                        if (finished) { cr.gone = true; return; }
                        cr.ph = 'hidden'; cr.t = 100 + Math.random() * 240;
                    }
                }
                if (cr.ph !== 'hidden') drawMole(cr, cr.lift || 0);
            }

            if (cr.type === 'butterfly') {
                if (!cr.init) { cr.init = true; pickFlyTarget(cr); }
                if (cr.state === 'sit') {
                    if (mowerNear(cr, 3) || --cr.t <= 0) { cr.state = 'idle'; pickFlyTarget(cr); }
                    drawButterfly(cr, ((now / 320) | 0) % 2 === 0);
                } else {
                    if (mowerNear(cr, 3)) {
                        pt = awayPoint(cr, 8); cr.tx = pt.x; cr.ty = Math.max(TILE, pt.y - TILE * 2);
                    }
                    cr.vx += (cr.tx - cr.x) * 0.002; cr.vy += (cr.ty - cr.y) * 0.002;
                    cr.vx *= 0.96; cr.vy *= 0.96;
                    d = Math.sqrt(cr.vx * cr.vx + cr.vy * cr.vy) || 1;
                    if (d > 1.7) { cr.vx = cr.vx / d * 1.7; cr.vy = cr.vy / d * 1.7; }
                    cr.x += cr.vx;
                    cr.y += cr.vy + Math.sin(now * 0.02 + cr.phase) * 0.5;
                    var bdx = cr.tx - cr.x, bdy = cr.ty - cr.y;
                    if (bdx * bdx + bdy * bdy < 64) {
                        if (cr.land) { cr.state = 'sit'; cr.t = 140 + Math.random() * 160; }
                        else pickFlyTarget(cr);
                    }
                    drawButterfly(cr, ((now / 90) | 0) % 2 === 0);
                }
            }
        }

        function pickFlyTarget(cr) {
            cr.land = false;
            if (Math.random() < 0.65 && mowedCount < total) {
                for (var t = 0; t < 60; t++) {
                    var i = (Math.random() * total) | 0;
                    if (!mowed[i] && variants[i] >= 4) {
                        var pt = tileCenter(i);
                        cr.tx = pt.x; cr.ty = pt.y - 4;
                        cr.land = true;
                        return;
                    }
                }
            }
            cr.tx = TILE + Math.random() * (fx.width - TILE * 2);
            cr.ty = TILE + Math.random() * (fx.height * 0.85);
        }

        /* ---------- fireflies (night / dusk) ---------- */
        var flies = [];

        function spawnFlies(n) {
            flies = [];
            for (var i = 0; i < n; i++) {
                flies.push({
                    x: Math.random() * fx.width,
                    y: Math.random() * fx.height * 0.92,
                    p: Math.random() * 6.28,
                    s: 0.25 + Math.random() * 0.4
                });
            }
        }

        function drawFlies(now) {
            for (var i = 0; i < flies.length; i++) {
                var fl = flies[i];
                fl.x += Math.sin(now * 0.0006 + fl.p) * fl.s;
                fl.y += Math.cos(now * 0.0005 + fl.p * 1.3) * fl.s * 0.8;
                if (fl.x < -10) fl.x = fx.width + 10;
                if (fl.x > fx.width + 10) fl.x = -10;
                if (fl.y < -10) fl.y = fx.height + 10;
                if (fl.y > fx.height + 10) fl.y = -10;
                var glow = 0.5 + 0.5 * Math.sin(now * 0.004 + fl.p * 3);
                if (gfx === 'ultra') {
                    // soft bokeh orbs
                    fctx.globalAlpha = 0.25 * glow + 0.06;
                    fctx.fillStyle = '#ffe97a';
                    fctx.shadowColor = '#ffe97a';
                    fctx.shadowBlur = 12;
                    fctx.beginPath();
                    fctx.arc(fl.x, fl.y, 2.4, 0, 6.2832);
                    fctx.fill();
                    fctx.shadowBlur = 0;
                    continue;
                }
                fctx.globalAlpha = 0.14 * glow;
                fctx.fillStyle = '#ffee58';
                fctx.fillRect(fl.x - 4, fl.y - 4, 12, 12);
                fctx.globalAlpha = 0.4 + 0.6 * glow;
                fctx.fillStyle = '#fff59d';
                fctx.fillRect(fl.x, fl.y, 4, 4);
            }
            fctx.globalAlpha = 1;
        }

        function fxLoop(now) {
            now = now || 0;
            fctx.clearRect(0, 0, fx.width, fx.height);
            if (gfx === 'retro') { // pixel critters only live in the retro lawn
                for (var ci = critters.length - 1; ci >= 0; ci--) {
                    updateCritter(critters[ci], now);
                    if (critters[ci].gone) critters.splice(ci, 1);
                }
            }
            for (var i = parts.length - 1; i >= 0; i--) {
                var p = parts[i];
                p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life -= 0.025;
                if (p.life <= 0) { parts.splice(i, 1); continue; }
                fctx.globalAlpha = Math.min(1, p.life);
                fctx.fillStyle = p.color;
                if (p.glow) { fctx.shadowColor = p.color; fctx.shadowBlur = 10; }
                fctx.fillRect(p.x | 0, p.y | 0, p.w || p.size, p.h || p.size);
                if (p.glow) fctx.shadowBlur = 0;
            }
            fctx.globalAlpha = 1;
            // pulse the last few unmowed patches so they're easy to find
            var left = total - mowedCount;
            if (!finished && total && mowedCount > 0 && left <= Math.max(10, total * 0.02)) {
                fctx.globalAlpha = 0.35 + 0.35 * Math.sin(now * 0.01);
                fctx.strokeStyle = '#ffd740';
                fctx.lineWidth = gfx === 'ultra' ? 2 : 3;
                if (gfx === 'ultra') { fctx.shadowColor = '#ffd740'; fctx.shadowBlur = 14; }
                for (var ti = 0; ti < total; ti++) {
                    if (mowed[ti]) continue;
                    fctx.strokeRect((ti % cols) * TILE + 2, ((ti / cols) | 0) * TILE + 2, TILE - 4, TILE - 4);
                }
                fctx.shadowBlur = 0;
                fctx.globalAlpha = 1;
            }
            drawFlies(now);
            requestAnimationFrame(fxLoop);
        }

        /* ---------- sound (Web Audio, generated) ---------- */
        var audio = null, soundOn = true, lastWhirr = 0;

        // The icon reflects whether sound can actually play right now.
        function setIcon() {
            var live = soundOn && audio && audio.state === 'running';
            muteBtn.textContent = live ? '🔊' : '🔇';
            muteBtn.setAttribute('aria-pressed', String(live));
        }

        var iosUnlocked = false;
        var unmuteTried = false;

        function ensureAudio() {
            if (!audio) {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return false;
                audio = new AC();
            }
            if (audio.state !== 'running') {
                var p = audio.resume();
                if (p && p.then) p.then(setIcon).catch(function () {});
            }
            // Silent <audio> loop: switches iOS to media-playback mode so the
            // ring/silent switch no longer mutes Web Audio. Must start inside
            // a user gesture; retry until it sticks.
            if (!unmuteTried) {
                unmuteTried = true;
                var um = document.getElementById('unmuter');
                var pp = um.play();
                if (pp && pp.catch) pp.catch(function () { unmuteTried = false; });
            }
            // iOS fully unlocks only after a (silent) buffer plays inside a gesture.
            if (!iosUnlocked) {
                try {
                    var buf = audio.createBuffer(1, 1, 22050);
                    var src = audio.createBufferSource();
                    src.buffer = buf;
                    src.connect(audio.destination);
                    src.start(0);
                    iosUnlocked = true;
                } catch (err) { /* ignore */ }
            }
            return true;
        }

        function blip(freq, t0, dur, vol) {
            var osc = audio.createOscillator();
            var gain = audio.createGain();
            osc.type = 'square';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(vol, t0);
            gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            osc.connect(gain).connect(audio.destination);
            osc.start(t0); osc.stop(t0 + dur);
        }

        var noiseBuf = null;

        function whoosh() { // soft organic cutting sound for ultra mode
            if (!noiseBuf) {
                noiseBuf = audio.createBuffer(1, (audio.sampleRate * 0.5) | 0, audio.sampleRate);
                var d = noiseBuf.getChannelData(0);
                for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            var t = audio.currentTime;
            var src = audio.createBufferSource();
            src.buffer = noiseBuf;
            var f = audio.createBiquadFilter();
            f.type = 'lowpass';
            f.frequency.value = 700 + Math.random() * 600;
            var g = audio.createGain();
            g.gain.setValueAtTime(0.18, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
            src.connect(f); f.connect(g); g.connect(audio.destination);
            src.start(t, Math.random() * 0.3);
            src.stop(t + 0.18);
        }

        function chimeNote(freq, t0, dur, vol) {
            var o = audio.createOscillator(), g = audio.createGain();
            o.type = 'sine';
            o.frequency.value = freq;
            g.gain.setValueAtTime(vol, t0);
            g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            o.connect(g).connect(audio.destination);
            o.start(t0); o.stop(t0 + dur);
        }

        function whirr() {
            if (!soundOn || !audio) return;
            var now = performance.now();
            if (now - lastWhirr < 95) return;
            lastWhirr = now;
            if (audio.state !== 'running') { ensureAudio(); return; }
            if (gfx === 'ultra') { whoosh(); return; }
            // Three layers: low chug + mid body + bright tick so it carries
            // on small phone speakers.
            blip(80 + Math.random() * 70, audio.currentTime, 0.08, 0.1);
            blip(330 + Math.random() * 140, audio.currentTime, 0.06, 0.07);
            blip(720 + Math.random() * 180, audio.currentTime, 0.03, 0.04);
        }

        function victoryTune() {
            if (!soundOn || !audio) return;
            if (audio.state !== 'running') { ensureAudio(); return; }
            if (gfx === 'ultra') {
                var t = audio.currentTime;
                chimeNote(523, t, 1.4, 0.12);
                chimeNote(784, t + 0.18, 1.6, 0.11);
                chimeNote(1047, t + 0.36, 2.0, 0.08);
                return;
            }
            var notes = [523, 659, 784, 1047];
            for (var i = 0; i < notes.length; i++) {
                blip(notes[i], audio.currentTime + i * 0.13, 0.22, 0.13);
            }
        }

        // Browsers block audio until a user gesture. Older iOS only honors
        // touchend, so listen broadly and detach once audio is truly running.
        var unlockEvents = ['pointerdown', 'touchend', 'keydown'];
        function detachUnlock() {
            unlockEvents.forEach(function (t) { window.removeEventListener(t, unlockAudio); });
        }
        function unlockAudio(e) {
            if (e && e.target && muteBtn.contains(e.target)) return; // the toggle manages itself
            if (!soundOn) { detachUnlock(); return; }
            ensureAudio();
            if (audio && audio.state === 'running') { setIcon(); detachUnlock(); }
        }
        unlockEvents.forEach(function (t) { window.addEventListener(t, unlockAudio); });

        muteBtn.addEventListener('click', function () {
            if (!audio || audio.state !== 'running') {
                // First interaction while still locked: unlock and turn sound on.
                soundOn = true;
                if (!ensureAudio()) soundOn = false;
            } else {
                soundOn = !soundOn;
            }
            setIcon();
            if (soundOn && audio) blip(660, audio.currentTime, 0.12, 0.12);
        });

        /* ---------- mowing ---------- */
        var hudQueued = false;
        var startTime = null;   // first manual mow
        var skipped = false;    // MOW ALL used: run doesn't count for best time

        function updateHud() {
            if (hudQueued) return;
            hudQueued = true;
            requestAnimationFrame(function () {
                hudQueued = false;
                var pct = total ? Math.floor((mowedCount / total) * 100) : 0;
                var left = total - mowedCount;
                pctEl.textContent = finished ? '100%'
                    : (left > 0 && left <= 20 ? left + ' LEFT!' : pct + '%');
                if (!finished && pct > 0) document.title = '🌱 ' + pct + '% MOWED · MO BASHAGHA';
                if (!finished && mowedCount / total > 0.08) toast.classList.add('hide');
                if (!finished && mowedCount >= total) finishLawn();
            });
        }

        function mowAt(x, y, withParticles) {
            var tc = Math.floor(x / TILE), tr = Math.floor(y / TILE);
            var maxD2 = (TILE * 1.6) * (TILE * 1.6);
            var did = false;
            for (var r = tr - 2; r <= tr + 2; r++) {
                if (r < 0 || r >= rows) continue;
                for (var c = tc - 2; c <= tc + 2; c++) {
                    if (c < 0 || c >= cols) continue;
                    var i = r * cols + c;
                    if (mowed[i]) continue;
                    var cx = (c + 0.5) * TILE, cy = (r + 0.5) * TILE;
                    var dxp = cx - x, dyp = cy - y;
                    if (dxp * dxp + dyp * dyp > maxD2) continue;
                    mowed[i] = 1; mowedCount++; did = true;
                    gctx.clearRect(c * TILE, r * TILE, TILE, TILE);
                    if (withParticles) spawnClippings(cx, cy, 3);
                }
            }
            if (did) {
                if (startTime === null && !skipped) startTime = performance.now();
                maskDirty = true;
                whirr(); updateHud();
            }
        }

        var lastX = null, lastY = null;

        function onMove(e) {
            if (finished) return;
            var x = e.clientX, y = e.clientY;
            // mower cursor (retro) + cutter ring (ultra)
            mowerEl.style.opacity = '1';
            mowerEl.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
            cutter.classList.add('on');
            cutter.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
            if (lastX !== null && x < lastX - 2) mowerEl.classList.add('flip');
            else if (lastX !== null && x > lastX + 2) mowerEl.classList.remove('flip');
            // interpolate so fast swipes leave no gaps
            if (lastX === null) { mowAt(x, y, true); }
            else {
                var dx = x - lastX, dy = y - lastY;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var steps = Math.max(1, Math.ceil(dist / (TILE / 2)));
                for (var s = 1; s <= steps; s++) {
                    mowAt(lastX + (dx * s) / steps, lastY + (dy * s) / steps, true);
                }
            }
            lastX = x; lastY = y;
        }

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerdown', onMove);

        /* ---------- mow all (column sweep) ---------- */
        mowallBtn.addEventListener('click', function () {
            if (finished || sweepTimer) return;
            skipped = true;
            toast.classList.add('hide');
            var c = 0;
            sweepTimer = setInterval(function () {
                if (finished) { clearInterval(sweepTimer); return; }
                for (var k = 0; k < 2 && c < cols; k++, c++) {
                    for (var r = 0; r < rows; r++) {
                        var i = r * cols + c;
                        if (mowed[i]) continue;
                        mowed[i] = 1; mowedCount++;
                        gctx.clearRect(c * TILE, r * TILE, TILE, TILE);
                        if (Math.random() < 0.12) spawnClippings((c + 0.5) * TILE, (r + 0.5) * TILE, 2);
                    }
                }
                maskDirty = true;
                whirr(); updateHud();
                if (c >= cols) { clearInterval(sweepTimer); sweepTimer = null; }
            }, 16);
        });

        /* ---------- completion ---------- */
        function finishLawn() {
            if (finished) return;
            finished = true;
            if (sweepTimer) { clearInterval(sweepTimer); sweepTimer = null; }
            mowedCount = total;
            pctEl.textContent = '100%';
            document.title = '✅ LAWN CLEARED · MO BASHAGHA';
            // mow time + personal best (only for fully hand-mowed runs)
            if (!skipped && startTime !== null) {
                var secs = (performance.now() - startTime) / 1000;
                var line = 'CLEARED IN ' + secs.toFixed(1) + 'S';
                var best = null;
                try { best = parseFloat(localStorage.getItem('mowBest')); } catch (e) { /* private mode */ }
                if (best && !isNaN(best)) {
                    if (secs < best) line += ' · ★ NEW BEST!';
                    else line += ' · BEST: ' + best.toFixed(1) + 'S';
                }
                if (!best || isNaN(best) || secs < best) {
                    try { localStorage.setItem('mowBest', secs.toFixed(1)); } catch (e) { /* ignore */ }
                }
                var timeEl = document.getElementById('clearTime');
                timeEl.textContent = line;
                timeEl.hidden = false;
            }
            grass.classList.add('gone');
            glCv.classList.add('gone');
            finishedAt = performance.now();
            maskDirty = true;
            body.classList.add('done');
            banner.classList.add('show');
            spawnConfetti();
            victoryTune();
            setTimeout(function () { banner.classList.add('fade'); }, 2600);
            setTimeout(function () { banner.classList.remove('show'); }, 3300);
        }

        /* ---------- boot ---------- */
        buildSprites();
        initGL();
        initGrid();
        setGfx(gfx, false);
        spawnFlies(mode === 'night' ? 22 : mode === 'dusk' ? 7 : 0);

        // two random critters per visit
        var pool = ['frog', 'snake', 'mole', 'butterfly'];
        for (var sp = 0; sp < 2; sp++) {
            critters.push(makeCritter(pool.splice((Math.random() * pool.length) | 0, 1)[0]));
        }

        requestAnimationFrame(windLoop);
        requestAnimationFrame(fxLoop);

        var resizeT = null;
        window.addEventListener('resize', function () {
            if (finished) return;
            clearTimeout(resizeT);
            resizeT = setTimeout(initGrid, 120);
        });

        // small debug/testing handle
        window.LAWN = {
            finish: finishLawn,
            setMode: setMode,
            setGfx: setGfx,
            progress: function () { return total ? mowedCount / total : 0; },
            spawnCritter: function (t) { critters.push(makeCritter(t)); },
            clearCritters: function () { critters = []; },
            blip: function () {
                if (soundOn && audio && audio.state === 'running') blip(880, audio.currentTime, 0.07, 0.08);
            }
        };
    })();
    </script>
</body>
</html>
